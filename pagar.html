<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080D14">
<title>vamo — pagar cuota</title>
<script src="https://checkout.epayco.co/checkout-v2.js"></script>
<style>
/* ===== VAMO . BRAND CONFIG =========================================
   Toda la identidad vive en estas variables. Para publicar la misma
   plataforma con la marca de un comercializador, se cambian SOLO
   estos valores y el logo (img con data:image/svg+xml) - nada mas.
   =================================================================== */
:root{
  --bg:#080D14; --c1:#0D141D;
  --gold:#F26B45; --gold2:#FF8A62;
  --wh:#F0F3F6; --muted:#8593A2;
}
  body {
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--wh);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    text-align: center;
  }
  .box { max-width: 380px; padding: 24px; }
  .logo { width: 54px; height: 54px; display: block; margin: 0 auto 12px; }
  .brand {
    font-size: 30px;
    font-weight: 900;
    letter-spacing: -1.4px;
    color: var(--wh);
    text-transform: lowercase;
    line-height: 1;
  }
  .tagline {
    font-family: monospace;
    font-size: 9px;
    letter-spacing: 3px;
    color: var(--gold);
    text-transform: uppercase;
    margin-top: 6px;
    margin-bottom: 24px;
  }
  #status { color: var(--muted); font-size: 14px; line-height: 1.6; }
  #btnPortal {
    display: none;
    margin-top: 24px;
    padding: 12px 28px;
    background: var(--gold);
    color: var(--c1);
    font-weight: bold;
    font-size: 13px;
    text-decoration: none;
    border-radius: 8px;
    letter-spacing: 0.5px;
  }
  .legal { margin-top: 28px; font-size: 10px; color: #55626F; line-height: 1.5; }
</style>
</head>
<body>
  <div class="box">
    <img class="logo" src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%23F26B45%22%20stroke-width%3D%229%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M25%2028L47%2050L25%2072%22%20opacity%3D%220.38%22%2F%3E%3Cpath%20d%3D%22M53%2028L75%2050L53%2072%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E" alt="vamo">
    <div class="brand">vamo</div>
    <div class="tagline">Crédito para moverte</div>
    <p id="status">Abriendo tu pago seguro...</p>
    <a id="btnPortal" href="https://tribu-gps-portal.vercel.app/index.html">Ir al portal de pagos</a>
    <div class="legal">vamo es una marca operada por Tribu GPS SAS &middot; NIT 901.356.553-8</div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get('session');
    const refPayco = params.get('ref_payco');
    const statusEl = document.getElementById('status');

    // Cambia a false cuando ePayco confirme que tu cuenta ya esta en modo produccion
    const MODO_PRUEBAS = false;

    if (sessionId) {
      // Caso 1: llegada inicial con ?session=... -> abrir el checkout
      const checkout = ePayco.checkout.configure({
        sessionId: sessionId,
        type: 'onpage',
        test: MODO_PRUEBAS
      });

      checkout.setHooks({
        onCreated: () => {
          statusEl.textContent = 'Completa tu pago en la ventana que se abrió.';
        },
        onResponse: (response) => {
          statusEl.textContent = 'Pago procesado. Ya puedes cerrar esta ventana.';
        },
        onErrors: (error) => {
          statusEl.textContent = 'Hubo un error al procesar el pago. Intenta de nuevo o contacta a vamo.';
        },
        onClosed: () => {
          // El usuario cerro el checkout; no se requiere accion aqui.
        }
      });

      checkout.open();

    } else if (refPayco) {
      // Caso 2: ePayco redirige de vuelta aqui despues de completar el pago,
      // con ?ref_payco=... en vez de ?session=...
      // OJO: esta pagina es solo para mostrarle algo al cliente. La
      // confirmacion REAL y definitiva del pago siempre llega por el
      // webhook (WH1 en n8n), no desde aqui — por eso el mensaje es
      // deliberadamente prudente y nunca dice "no se pago" con certeza.
      statusEl.textContent = 'Confirmando tu pago, un momento...';

      // Reemplaza esta URL por la Production URL real de tu nodo
      // "CP1. Recibir Consulta de Pago" en n8n (mismo procedimiento que
      // usaste para IP1 y WH1: abrir el nodo -> copiar Production URL).
      const URL_CONSULTA_PAGO = 'https://tribugps.pikapod.net/webhook/consultar-pago';

      fetch(URL_CONSULTA_PAGO + '?ref_payco=' + encodeURIComponent(refPayco))
        .then(r => r.json())
        .then(data => {
          console.log('Respuesta de consulta de pago (via n8n):', data);
          const respuesta = data && data.respuesta;

          if (respuesta === 'Aceptada') {
            statusEl.textContent = 'Tu pago fue aprobado. En unos minutos recibirás la confirmación por WhatsApp.';
          } else if (respuesta === 'Pendiente') {
            statusEl.textContent = 'Tu pago está pendiente de confirmación. Te avisaremos por WhatsApp en cuanto se confirme.';
          } else if (respuesta === 'Rechazada' || respuesta === 'Fallida') {
            statusEl.textContent = 'Tu pago no pudo procesarse. Intenta de nuevo o contacta a vamo.';
          } else {
            statusEl.textContent = 'Tu pago está siendo confirmado. Recibirás un mensaje de WhatsApp en cuanto se verifique.';
          }
          document.getElementById('btnPortal').style.display = 'inline-block';
        })
        .catch(() => {
          // Si esta consulta falla, no asumimos que el pago fallo —
          // el webhook (WH1) es la fuente real de la confirmacion.
          statusEl.textContent = 'Tu pago está siendo confirmado. Recibirás un mensaje de WhatsApp en cuanto se verifique.';
          document.getElementById('btnPortal').style.display = 'inline-block';
        });

    } else {
      statusEl.textContent = 'Enlace de pago invalido o incompleto. Contacta a vamo.';
    }
  </script>
</body>
</html>
